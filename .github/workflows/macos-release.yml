name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 0.1.4'
        required: true
        default: '0.1.4'
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            binary_arch: arm64
            target_arch: arm64
          - arch: x64
            runner: macos-15
            binary_arch: x86_64
            target_arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm run setup

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort -V | tail -n 1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          swift --version

      - name: Set requested version
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          npm version '${{ inputs.version }}' --no-git-tag-version --allow-same-version
          npm --prefix desktop version '${{ inputs.version }}' --no-git-tag-version --allow-same-version

      - name: Build macOS companion and share host
        env:
          GBA_TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail
          npm run build:native
          npm run build:share

      # Signing material never lands in the repository: the certificate goes into
      # a throwaway keychain and the notarization key into a file outside the tree.
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$CERT_P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k actions "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write the notarization API key
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      # package-mac-signed.sh reads ~/.gba-signing/env; the same values come from
      # the repository secrets here instead of a developer machine.
      - name: Sign, notarize and staple
        env:
          CSC_NAME: ${{ secrets.MAC_CERTIFICATE_NAME }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gba-signing"
          cat > "$HOME/.gba-signing/env" <<EOF
          export CSC_NAME="$CSC_NAME"
          export APPLE_API_ISSUER="$APPLE_API_ISSUER"
          export APPLE_API_KEY_ID="$APPLE_API_KEY_ID"
          export APPLE_API_KEY_PATH="$APPLE_API_KEY_PATH"
          export APPLE_TEAM_ID="$APPLE_TEAM_ID"
          EOF
          bash desktop/scripts/package-mac-signed.sh ${{ matrix.arch }}

      - name: Check signatures, architecture and staples
        run: |
          set -euo pipefail
          APP=$(find desktop/release -maxdepth 3 -name '*.app' | head -n 1)
          DMG=$(find desktop/release -maxdepth 1 -name '*.dmg' | head -n 1)
          test -n "$APP"; test -n "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv -t exec "$APP"
          file "$APP/Contents/MacOS/Grok Bot Anywhere" | grep -E "${{ matrix.binary_arch }}"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          shasum -a 256 "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: desktop/release/*.dmg
          if-no-files-found: error
