name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 0.1.0'
        required: true
        default: '0.1.0'
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm run setup

      # Signing material never lands in the repository: the certificate goes into
      # a throwaway keychain and the notarization key into a file outside the tree.
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k actions "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write the notarization API key
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      # package-mac-signed.sh reads ~/.gba-signing/env; the same values come from
      # the repository secrets here instead of a developer machine.
      - name: Sign, notarize and staple
        env:
          CSC_NAME: ${{ secrets.MAC_CERTIFICATE_NAME }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gba-signing"
          cat > "$HOME/.gba-signing/env" <<EOF
          export CSC_NAME="$CSC_NAME"
          export APPLE_API_ISSUER="$APPLE_API_ISSUER"
          export APPLE_API_KEY_ID="$APPLE_API_KEY_ID"
          export APPLE_API_KEY_PATH="$APPLE_API_KEY_PATH"
          export APPLE_TEAM_ID="$APPLE_TEAM_ID"
          EOF
          bash desktop/scripts/package-mac-signed.sh ${{ matrix.arch }}

      - name: Check the signature and the staple
        run: |
          set -euo pipefail
          APP=$(find desktop/release -maxdepth 2 -name '*.app' | head -n 1)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: desktop/release/*.dmg
          if-no-files-found: error
