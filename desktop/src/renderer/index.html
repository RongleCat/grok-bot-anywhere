<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Grok Bot Anywhere</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <label class="search"><input id="search" type="search" spellcheck="false" autocomplete="off"></label>
      <div id="grid" class="bot-grid"></div>
      <nav id="navigation" aria-label="Navigation"></nav>
      <button id="shortcut-hint" class="shortcut-hint" type="button"></button>
      <button id="account-nav" class="account-nav" type="button"></button>
    </aside>
    <main>
      <div id="notice" role="status" hidden></div>
      <div id="content"></div>
    </main>
  </div>
  <div id="toast" role="alert" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
