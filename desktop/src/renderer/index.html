<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Grok Bot Anywhere</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="titlebar-side">
        <button id="search-toggle" class="titlebar-button" type="button" aria-pressed="true" aria-controls="search"></button>
        <button id="sync" class="titlebar-button" type="button"></button>
        <button id="group-toggle" class="titlebar-button" type="button" aria-pressed="false"></button>
      </div>
      <div id="titlebar-title" class="titlebar-title"></div>
    </header>
    <aside class="sidebar">
      <div class="search-row">
        <label class="search"><input id="search" type="search" spellcheck="false" autocomplete="off"></label>
      </div>
      <div id="grid" class="bot-list"></div>
      <div class="sidebar-foot">
        <nav id="navigation"></nav>
      </div>
    </aside>
    <main>
      <div id="notice" role="status" hidden></div>
      <div id="content"></div>
    </main>
  </div>
  <div id="toast" role="alert" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
